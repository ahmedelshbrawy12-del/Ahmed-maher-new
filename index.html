<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2433;--mut:#6b7689;--pri:#1f6feb;--ok:#12a150;--bad:#e5484d;--bd:#e3e8f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141c;--card:#192130;--tx:#e8edf6;--mut:#93a0b5;--pri:#5b9bff;--ok:#3ccf83;--bad:#ff7b80;--bd:#2a3548}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:80px}
.w{max-width:560px;margin:auto;padding:14px}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.site{cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.n{font-weight:700;font-size:16px}.m{color:var(--mut);font-size:13px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--pri)}
.tot{position:fixed;bottom:0;left:0;right:0;background:var(--pri);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;text-align:center;font-size:13px}
.tot b{display:block;font-size:17px}
button,input{font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.g{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.r{background:transparent;color:var(--bad);padding:4px 8px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.sum b{display:block;font-size:16px;margin-top:4px}
.ex img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,420px)}
.hd{background:var(--pri);color:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--pri);color:#fff;padding:7px}td{padding:7px;border-bottom:1px solid var(--bd);text-align:center}
@media print{.noprint,.tot{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid}}

.w,.tot,dialog{position:relative;z-index:1}.tot{position:fixed}dialog{position:fixed}
body.rep::before{display:none}
.lh{width:100%;height:auto;display:block;margin:0 0 12px;image-rendering:auto}
@media print{body::before{display:none}.w{max-width:none;padding:0}.lh{margin-bottom:10px}}
@media print{
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;color:#000;line-height:1.6}
h1{font-size:24px;text-align:center;margin:8px 0 12px;color:#000}
.hd{background:#fff!important;color:#000!important;border:2px solid #1b2433;font-size:17px;font-weight:700;text-align:center}
.card{border:1.5px solid #1b2433;box-shadow:none;padding:12px}
.card .row b{font-size:20px;color:#000}
.m{color:#222;font-size:15px;font-weight:600}
table{font-size:16px;border:1.5px solid #1b2433;margin-top:8px}
th{background:#1b2433!important;color:#fff!important;font-size:16px;padding:10px;border:1px solid #1b2433}
td{padding:10px;border:1px solid #6b7689;color:#000;font-weight:600}
td:first-child{text-align:right}
.ok,.bad{font-weight:800;font-size:17px}
.ok{color:#0b7a3b}.bad{color:#c2262b}
}
.dt{text-align:left;color:var(--mut);font-size:14px;margin:0 0 6px}
.sn{text-align:center;color:var(--bad);font-size:22px;font-weight:800;margin-bottom:8px}
@media print{.dt{color:#000;font-size:16px;font-weight:700}.sn{color:#c2262b;font-size:26px}}
.tt td{color:var(--bad);font-size:18px;font-weight:900}
@media print{.tt td{color:#c2262b;font-size:21px;font-weight:900;border-top:2px solid #c2262b}}
.ih{font-weight:800;margin:16px 0 8px;text-align:center;font-size:17px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ig figure{margin:0;break-inside:avoid;border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}
.ig img{width:100%;height:auto;display:block;border-radius:4px}
.ig figcaption{font-size:13px;font-weight:700;margin-top:4px}
@media print{.w .card{break-inside:auto}tr{break-inside:avoid}.ih{font-size:19px;color:#000}.ig figure{border:1.5px solid #1b2433}.ig figcaption{font-size:14px;color:#000}}
.ig{grid-template-columns:1fr!important}
.ig img{cursor:pointer}
@media print{.im{break-before:page;page-break-before:always}.ig{gap:14px}.ig img{width:auto;max-width:100%;max-height:235mm;margin:0 auto;object-fit:contain}.ig figcaption{font-size:16px}}
#lock{position:fixed;inset:0;background:#fdfdfd;color:#1b2433;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px;text-align:center;overflow:auto}
#lock img{width:min(70vw,320px);height:auto;margin-bottom:18px}
#lock h2{margin:0 0 14px;font-size:20px;color:#283580}
#lock input{max-width:320px;text-align:center;font-size:18px;letter-spacing:3px;background:#fff;color:#1b2433;border:1px solid #c9d1e3}
#lock .btn{background:#283580;width:100%;max-width:320px;margin-top:8px;padding:12px}
#lerr{color:#e5484d;font-size:14px;min-height:20px;margin-top:6px;font-weight:700}
body.locked .w,body.locked .tot{display:none!important}
body.locked::before{display:none!important}
@media print{#lock{display:none!important}}
#lhint{background:#eef2ff;color:#283580;border:1px dashed #283580;border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.8;margin-top:8px;max-width:320px;width:100%}
#lhint b{font-size:18px;letter-spacing:3px}
.nt{font-size:18px!important;font-weight:700}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;border:2px solid #8893a5;margin:3px;vertical-align:middle;cursor:pointer}
.nrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:6px 0}.nrow>span{font-size:13px;color:var(--mut);min-width:70px}
.nb{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin:2px;cursor:pointer}

function idbPut(k,v){cloudImg(k,v);return new Promise(r=>{if(!DB)return r(false);try{const tx=DB.transaction("i","readwrite");tx.objectStore("i").put(v,k);tx.oncomplete=()=>r(true);tx.onerror=tx.onabort=()=>r(false)}catch(e){r(false)}})}

  <div class="nrow"><span>تمييز</span>${sw(NHL,"nHl")}<button class="nb" onmousedown="event.preventDefault()" onclick="nHl('transparent')">إزالة</button></div>
  </div>
  <div class="card"><input id="nt" class="nt" placeholder="عنوان الملاحظة" value="${esc(n.title||"")}" style="color:${NTC||"inherit"}" oninput="noteDirty()">
  <div id="ned" class="ned" contenteditable="true" dir="auto" oninput="noteDirty()"></div>
  <div class="m">أُنشئت: ${nFmt(n.c)}<br>آخر تعديل: <span id="nds">${nFmt(n.u)}</span></div><div id="nst" class="m" style="min-height:20px;margin-top:4px"></div></div>
  <button class="btn r" onclick="noteDel()">🗑️ حذف الملاحظة</button>`;
  $("ned").innerHTML=nClean(n.body);return}
 A.dataset.ne="";
 const L=[...N.notes].sort((a,b)=>(b.u||0)-(a.u||0));
 A.innerHTML=`<div class="row"><button class="btn g" onclick="view='main';render()">→ رجوع</button></div><div class="row" style="margin:10px 0"><button class="btn" onclick="noteNew()">＋ ملاحظة جديدة</button></div>`+
 (L.map(n=>`<div class="card site" onclick="noteMenu('${n.id}')"><div class="n" style="color:${/^[#\w(),.% ]+$/.test(n.tc||"")&&n.tc?n.tc:"inherit"}">${n.lock?"🔒 ":""}${esc(n.title||"بدون عنوان")}</div><div class="m npv">${n.lock?"ملاحظة مقفولة بالرقم السري":esc(nTxt(n.body).slice(0,120))}</div><div class="m" style="margin-top:6px">أُنشئت: ${nFmt(n.c)} · عُدّلت: ${nFmt(n.u)}</div></div>`).join("")||`<div class="card m">لا توجد ملاحظات بعد. اضغط "ملاحظة جديدة".</div>`)}
document.addEventListener("selectionchange",()=>{const e=$("ned"),s=getSelection();if(e&&s.rangeCount&&e.contains(s.anchorNode))NSEL=s.getRangeAt(0).cloneRange()});
function nCmd(c,v){const e=$("ned");if(!e)return;const s=getSelection();if(!(s.rangeCount&&e.contains(s.anchorNode))){e.focus();if(NSEL){s.removeAllRanges();s.addRange(NSEL)}}
 const col=s.rangeCount&&s.isCollapsed;
 try{document.execCommand("styleWithCSS",false,true);document.execCommand(c,false,v||null)}catch(x){}
 if(col&&/List$/.test(c)){try{let k=getSelection().anchorNode;while(k&&k!==e&&k.nodeName!=="LI")k=k.parentNode;if(k&&k.nodeName==="LI"){const r=document.createRange();r.selectNodeContents(k);r.collapse(false);const g=getSelection();g.removeAllRanges();g.addRange(r)}}catch(x){}}
 noteDirty()}
const nColor=c=>nCmd("foreColor",c),nHl=c=>nCmd(document.queryCommandSupported("hiliteColor")?"hiliteColor":"backColor",c);
function noteTitleColor(c){NTC=c;const t=$("nt");if(t)t.style.color=c||"inherit";noteDirty()}
function noteDirty(){const s=$("nst");if(s)s.textContent="✏️ جاري الحفظ...";clearTimeout(NT);NT=setTimeout(()=>noteSave(0),700)}
function noteSave(manual){clearTimeout(NT);const n=N.notes.find(x=>x.id===NID),e=$("ned");if(!n||!e||view!=="note")return;
 const t=$("nt").value.trim(),b=nClean(e.innerHTML),s=$("nst");
 if(t!==(n.title||"")||b!==(n.body||"")||NTC!==(n.tc||"")){n.title=t;n.body=b;n.tc=NTC;n.u=Date.now();cloudNotes();const d=$("nds");if(d)d.textContent=nFmt(n.u)}
 if(s)s.textContent="✓ تم الحفظ"}

function noteMenu(id){const n=N.notes.find(x=>x.id===id);if(!n)return;
 dlg(`<h3>${n.lock?"🔒 ":"📝 "}${esc(n.title||"بدون عنوان")}</h3><div class="m" style="line-height:2">اختار اللي عايز تعمله في الملاحظة:</div>
 <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
 <button class="btn" onclick="noteOpenAsk('${id}')">📖 فتح الملاحظة</button>
 ${n.lock?`<button class="btn g" onclick="notePinAsk('unlock','${id}')">🔓 إزالة القفل</button>`:`<button class="btn g" onclick="notePinAsk('lock','${id}')">🔒 قفل برقم سري</button>`}
 <button class="btn r" onclick="notePinAsk('del','${id}')">🗑️ حذف الملاحظة</button>
 <button class="btn g" onclick="$('dlg').close()">إلغاء</button></div>`)}
function noteOpenAsk(id){const n=N.notes.find(x=>x.id===id);if(!n)return;
 if(n.lock){notePinAsk('open',id);return}
 $("dlg").close();noteOpen(id)}
function notePinAsk(kind,id){
 const T={open:"🔒 ملاحظة مقفولة",lock:"🔒 قفل الملاحظة",unlock:"🔓 إزالة القفل",del:"⚠️ حذف الملاحظة"}[kind];
 const M={open:"اكتب الرقم السري عشان تفتح الملاحظة.",lock:"اكتب الرقم السري عشان تقفل الملاحظة. هيتطلب الرقم كل ما تفتحها.",unlock:"اكتب الرقم السري عشان تشيل القفل.",del:"هتتحذف الملاحظة نهائيًا. اكتب الرقم السري للمتابعة."}[kind];
 dlg(`<h3>${T}</h3><div class="m" style="line-height:2">${M}</div><input id="npin" type="password" inputmode="numeric" maxlength="32" placeholder="الرقم السري"><div id="npe" class="bad" style="font-size:13px;min-height:18px"></div><div class="row" style="margin-top:8px"><button class="btn${kind==="del"?" r":""}" onclick="notePinOk('${kind}','${id}')">تأكيد</button><button class="btn g" onclick="noteMenu('${id}')">رجوع</button></div>`);
 setTimeout(()=>{const x=$("npin");if(x)x.focus()},50)}
function notePinOk(kind,id){const x=$("npin");if(!x)return;
 if(x.value!==PIN){$("npe").textContent="الرقم السري غير صحيح";x.value="";return}
 const n=N.notes.find(z=>z.id===id);if(!n){$("dlg").close();return}
 $("dlg").close();
 if(kind==="open"){noteOpen(id);return}
 if(kind==="lock"){n.lock=true;n.u=Date.now();cloudNotes();render();return}
 if(kind==="unlock"){delete n.lock;n.u=Date.now();cloudNotes();render();return}
 if(kind==="del"){N.notes=N.notes.filter(z=>z.id!==id);cloudNotes();render()}}
function noteNew(){const t=Date.now(),n={id:"n"+t,title:"",tc:"",body:"",c:t,u:t};N.notes.push(n);NID=n.id;NSEL=null;view="note";render();scrollTo(0,0);const x=$("nt");if(x)x.focus()}
function noteOpen(id){NID=id;NSEL=null;view="note";render();scrollTo(0,0)}
function notesBack(){noteSave(0);const n=N.notes.find(x=>x.id===NID);
 if(n&&!n.title&&!nTxt(n.body)){N.notes=N.notes.filter(x=>x.id!==NID);cloudNotes()}
 NID=null;view="notes";render()}
function noteDel(){dlg(`<h3>⚠️ حذف الملاحظة</h3><div class="m" style="line-height:2">هل أنت متأكد من حذف هذه الملاحظة نهائيًا؟</div><div class="row" style="margin-top:12px"><button class="btn r" onclick="noteDelOk()">حذف</button><button class="btn g" onclick="$('dlg').close()">إلغاء</button></div>`)}
function noteDelOk(){clearTimeout(NT);N.notes=N.notes.filter(x=>x.id!==NID);NID=null;cloudNotes();$("dlg").close();view="notes";render();scrollTo(0,0)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)noteSave(0)});
addEventListener("pagehide",()=>noteSave(0));

</script>
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script></body></html>
